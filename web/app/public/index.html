<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Web Terminal</title>
    <style>
      :root {
        --bg: #0c0c0c;
        --fg: #cccccc;
        --accent: #0078d4;
      }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
        font-family: 'Cascadia Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
      #app { display: flex; flex-direction: column; height: 100vh; }
      #tabbar { display: flex; gap: 4px; padding: 4px 8px; background: #1f1f1f;
        border-bottom: 1px solid #333; user-select: none; }
      .tab { padding: 4px 10px; background: #2d2d2d; border-radius: 4px 4px 0 0;
        cursor: pointer; font-size: 12px; }
      .tab.active { background: var(--bg); border-top: 2px solid var(--accent); }
      .tab .close { margin-left: 8px; opacity: 0.6; }
      .tab .close:hover { opacity: 1; }
      #addtab { padding: 4px 10px; cursor: pointer; opacity: 0.7; font-size: 14px; }
      #addtab:hover { opacity: 1; }
      #panes { flex: 1; display: flex; position: relative; overflow: hidden; }
      .pane { flex: 1; position: relative; outline: none; }
      .pane.focused { box-shadow: inset 0 0 0 1px var(--accent); }
      canvas { display: block; width: 100%; height: 100%; }
      #status { font-size: 11px; padding: 2px 8px; background: #1f1f1f;
        border-top: 1px solid #333; color: #888; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="tabbar">
        <div id="tabs"></div>
        <div id="addtab" title="New tab (Ctrl+Shift+T)">+</div>
      </div>
      <div id="panes"></div>
      <div id="status">Web Terminal — Ctrl+Shift+T new tab · Ctrl+Shift+D split · Ctrl+Shift+W close · Ctrl+Shift+C copy</div>
    </div>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
